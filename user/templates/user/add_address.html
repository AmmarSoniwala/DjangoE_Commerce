{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Wiggly - Add Address</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-container">
            <h2 class="mb-4 text-center">Add Address</h2>
            <form method="POST" action="">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="{{ form.apartment_number.id_for_label }}">Apartment
                            Number</label>
                        {{ form.apartment_number }}
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="{{ form.label.id_for_label }}"
                            style="margin-left: 10px;">Label</label>
                        {{ form.label }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="{{ form.street_line_1.id_for_label }}">Street Line 1</label>
                    {{ form.street_line_1 }}
                </div>
                <div class="mb-3">
                    <label class="form-label" for="{{ form.street_line_2.id_for_label }}">Street Line 2</label>
                    {{ form.street_line_2 }}
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="{{ form.city.id_for_label }}">City</label>
                        {{ form.city }}
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="{{ form.state.id_for_label }}">State</label>
                        {{ form.state }}
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="{{ form.postal_code.id_for_label }}">Postal Code</label>
                        {{ form.postal_code }}
                    </div>
                </div>

                <div class="mb-3 form-check">
                    {{ form.is_default }}
                    <label class="form-check-label" for="{{ form.is_default.id_for_label }}">
                        Set as default address
                    </label>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-dark">Save Address</button>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary mt-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
